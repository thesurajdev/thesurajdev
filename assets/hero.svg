<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">Suraj Kumar — Creative Technologist</title><desc id="d">Original futuristic cyber interface with cyan and violet orbital elements and digital grid.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#040712"/><stop offset=".55" stop-color="#0b1230"/><stop offset="1" stop-color="#201044"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2=".5"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#818cf8"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
 <linearGradient id="white" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff"/><stop offset=".8" stop-color="#dbeafe"/><stop offset="1" stop-color="#a5f3fc"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#4f46e5" stop-opacity=".35"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#94a3b8" stroke-opacity=".1" stroke-width="1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/><ellipse cx="960" cy="175" rx="320" ry="270" fill="url(#aura)"/>
<!-- circuit trace -->
<g fill="none" stroke="url(#neon)" stroke-width="1.5" opacity=".76"><path d="M760 60h72l20 20h42M740 104h44l22 22h34M780 260h70l22-22h35M850 302h70l25-25h34M1065 45h52l20 20v35M1110 275h30l18-18v-35"/><path d="M802 178h45l15-15h24M1050 188h49l22 22h35"/></g>
<!-- reactor/orbit -->
<g transform="translate(1005 175)" fill="none"><circle r="128" stroke="#22d3ee" stroke-opacity=".46"/><circle r="102" stroke="#a78bfa" stroke-opacity=".5" stroke-dasharray="4 10"/><circle r="76" stroke="#67e8f9" stroke-opacity=".55" stroke-dasharray="26 8 3 8"/><ellipse rx="150" ry="49" transform="rotate(-32)" stroke="url(#neon)" stroke-opacity=".8"/><ellipse rx="150" ry="49" transform="rotate(40)" stroke="url(#neon)" stroke-opacity=".55"/><circle r="34" fill="#151b48" stroke="#67e8f9" stroke-width="1.5"/><path d="M-17 0h34M0-17v34" stroke="#67e8f9" stroke-opacity=".8"/></g>
<g fill="#67e8f9" filter="url(#glow)"><circle cx="861" cy="80" r="3"/><circle cx="872" cy="260" r="3"/><circle cx="1122" cy="103" r="3"/><circle cx="1157" cy="257" r="3"/></g>
<!-- title and identity -->
<rect x="72" y="59" width="195" height="28" rx="14" fill="#0a1128" stroke="#334155"/><circle cx="88" cy="73" r="4" fill="#34d399"/><text x="102" y="77" fill="#a5f3fc" font-family="monospace" font-size="11" letter-spacing="1.7">SYSTEM ONLINE</text>
<text x="74" y="132" fill="#9ca3af" font-family="monospace" font-size="13" letter-spacing="4">CREATIVE TECHNOLOGIST / 001</text>
<text x="68" y="199" fill="url(#white)" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="800" letter-spacing="-2">SURAJ KUMAR</text>
<rect x="75" y="222" width="4" height="31" rx="2" fill="#22d3ee" filter="url(#glow)"/><text x="93" y="243" fill="#dbeafe" font-family="monospace" font-size="16" letter-spacing="1.35">MARKETING × TECHNOLOGY × AUTOMATION</text>
<text x="76" y="293" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="2.4">THINK IN SYSTEMS  //  BUILD FOR PEOPLE  //  STAY CURIOUS</text>
<text x="1125" y="30" text-anchor="end" fill="#64748b" font-family="monospace" font-size="10" letter-spacing="2">SK / DIGITAL LAB</text>
<path d="M72 329H1128" stroke="url(#neon)" stroke-opacity=".7"/><path d="M72 329h210" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)"/>
</svg>
